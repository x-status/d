name: Run Webtop (Browser Desktop)

on:
  workflow_dispatch:

jobs:
  webtop:
    runs-on: ubuntu-latest
    environment:
      name: webtop
      url: ${{ steps.desktop_url.outputs.url }}
    steps:
      - parallel:
        - name: Start Webtop Container
          run: |
            docker run -d \
              --name=webtop \
              --security-opt seccomp=unconfined \
              -e PUID=1000 \
              -e PGID=1000 \
              -e TZ=Asia/Tokyo \
              -e CUSTOM_RES=1920x1080 \
              -e AUDIO_SUPPORT=true \
              -p 3000:3000 \
              -p 3001:3001 \
              --shm-size="1gb" \
              --restart unless-stopped \
              lscr.io/linuxserver/webtop:latest

        - name: Start Cloudflared
          run: |
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
            nohup cloudflared tunnel --url http://localhost:3000 >cf.log 2>&1 &

      - name: Get Desktop URL
        id: desktop_url
        run: |
          until url=$(grep -Pom1 'https://[\w-]+.trycloudflare.com' cf.log 2>/dev/null); do
            sleep 1
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "[Open Desktop1]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Open Desktop2: $url"
          echo "::notice title=Open Desktop3::$url"

      - name: Sleep
        run: sleep 180
