name: Run Webtop (Browser Desktop)

on:
  workflow_dispatch:

jobs:
  webtop:
    runs-on: ubuntu-latest
    steps:
      - parallel:
        - name: Start Webtop Container
          run: |
            docker run -d \
              --name=webtop \
              --security-opt seccomp=unconfined \
              -e PUID=1000 \
              -e PGID=1000 \
              -e TZ=Asia/Tokyo \
              -e CUSTOM_RES=1920x1080 \
              -e AUDIO_SUPPORT=true \
              -p 3000:3000 \
              -p 3001:3001 \
              --shm-size="1gb" \
              --restart unless-stopped \
              ghcr.io/linuxserver/webtop:latest

        - name: Show desktop url
          run: |
            until url=$(grep -Pom1 'https://[\w-]+.trycloudflare.com' cf.log); do
              sleep 1
            done
            echo "[Open Desktop]($url)" >> "$GITHUB_STEP_SUMMARY"

        - name: Install Cloudflared
          run: |
            wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared-linux-amd64.deb
            cloudflared tunnel --url http://localhost:3000 --logfile cf.log
