name: Fast Browser Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Install minimal desktop & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb fluxbox x11vnc novnc websockify wget
          # cloudflared（トンネル用単一バイナリ）の取得
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Desktop & Browser Stream
        run: |
          # 1. 仮想ディスプレイ起動 (1280x720, 16bitカラーで高速化)
          Xvfb :1 -screen 0 1280x720x16 &
          export DISPLAY=:1
          sleep 1

          # 2. Fluxbox (最軽量WM) 起動
          fluxbox &

          # 3. VNCサーバ起動 (localhost限定・パスワードなし)
          x11vnc -display :1 -nopw -listen localhost -forever -shared &

          # 4. noVNC (Websocket -> VNC) 起動 (ポート 6080)
          websockify --web /usr/share/novnc 6080 localhost:5900 &
          sleep 2

          # 5. Cloudflare TunnelでパブリックURLを発行
          echo "=================================================="
          echo "ブラウザでアクセスするURLは以下のログに出力されます (trycloudflare.com)"
          echo "=================================================="
          cloudflared tunnel --url http://localhost:6080/vnc.html
